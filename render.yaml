services:
    
  # ML Service (FastAPI). Runs int8 ONNX models downloaded from Hugging Face:
  # ~370 MB steady, ~410 MB peak, so it fits the 512 MB free instance (see ml-service/README.md)
  - type: web
    name: crisisconnect-ml
    env: python
    region: oregon
    plan: free
    rootDir: ml-service
    buildCommand: "pip install -r requirements.txt"
    startCommand: "uvicorn app:app --host 0.0.0.0 --port $PORT"
    healthCheckPath: /health
    envVars:
      - key: PYTHON_VERSION
        value: "3.12.7"
      # glibc otherwise gives each request thread its own heap arena (~100 MB more under load)
      - key: MALLOC_ARENA_MAX
        value: "2"

  # Backend API (Node.js/Express)
  - type: web
    name: crisisconnect-backend
    env: node
    region: oregon
    plan: free
    rootDir: server
    buildCommand: "npm ci && npx prisma generate && npx prisma migrate deploy"
    startCommand: "npm start"
    healthCheckPath: /
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: "3000"
      - key: DATABASE_URL
        fromDatabase:
          name: crisisconnect-db
          property: connectionString
      - key: JWT_SECRET
        generateValue: true
      - key: JWT_REFRESH_SECRET
        generateValue: true
      - key: ML_SERVICE_URL
        value: "https://crisisconnect-ml.onrender.com"
      - key: FRONTEND_URL
        value: "https://crisisconnect-frontend.onrender.com"
      # Optional: photo analysis. Set in the Render dashboard; never commit the key
      - key: GEMINI_API_KEY
        sync: false
    
  # Frontend (Static Site)
  - type: web
    name: crisisconnect-frontend
    env: static
    rootDir: frontend
    buildCommand: "npm ci && npm run build"
    staticPublishPath: dist
    envVars:
      - key: VITE_API_BASE_URL
        value: "https://crisisconnect-backend.onrender.com"

databases:
  - name: crisisconnect-db
    databaseName: crisisconnect
    user: crisisconnect
