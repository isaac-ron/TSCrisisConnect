services:
    
  # The ML service runs on a Hugging Face Space (see ml-service/README.md), not Render:
  # with its two RoBERTa models loaded it uses ~515 MB of RAM, over Render's 512 MB free tier.

  # Backend API (Node.js/Express)
  - type: web
    name: crisisconnect-backend
    env: node
    region: oregon
    plan: free
    rootDir: server
    buildCommand: "npm ci && npx prisma generate && npx prisma migrate deploy"
    startCommand: "npm start"
    healthCheckPath: /
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: "3000"
      - key: DATABASE_URL
        fromDatabase:
          name: crisisconnect-db
          property: connectionString
      - key: JWT_SECRET
        generateValue: true
      - key: JWT_REFRESH_SECRET
        generateValue: true
      - key: ML_SERVICE_URL
        value: "https://ron4444444-crisisconnect-ml.hf.space"
      - key: FRONTEND_URL
        value: "https://crisisconnect-frontend.onrender.com"
    
  # Frontend (Static Site)
  - type: web
    name: crisisconnect-frontend
    env: static
    rootDir: crisisconnecttypescript
    buildCommand: "npm ci && npm run build"
    staticPublishPath: dist
    envVars:
      - key: VITE_API_BASE_URL
        value: "https://crisisconnect-backend.onrender.com"

databases:
  - name: crisisconnect-db
    databaseName: crisisconnect
    user: crisisconnect
